# Temporary experiment: why can't the workflow token create release v0.2.3?
# Removed after it has run once.
name: Release probe

on: workflow_dispatch

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Release for a tag that already exists (pushed outside the workflow).
          if gh release create probe-existing-tag -R "$REPO" --verify-tag --prerelease --title probe --notes probe >/dev/null 2>err; then
            echo "RESULT existing tag on unsigned commit: OK"
            gh release delete probe-existing-tag -R "$REPO" --yes
          else
            echo "RESULT existing tag on unsigned commit: FAILED $(cat err)"
          fi
