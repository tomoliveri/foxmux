name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes older runs pointless. Runs on
# main always finish, since they may release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: scripts/retry.sh npm ci --ignore-scripts
      - run: npm run vendor
      - run: npm run lint
      - name: Audit shipped dependencies
        run: npm audit --omit=dev
      - run: scripts/retry.sh pip install -r requirements-dev.txt
      - run: ruff format --check native test
      - run: ruff check native test
      - run: shellcheck install.sh scripts/*.sh

  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, tmux: system }
          - { os: ubuntu-latest, tmux: release }
          - { os: macos-latest, tmux: system }
    uses: ./.github/workflows/e2e.yml
    with:
      os: ${{ matrix.os }}
      tmux: ${{ matrix.tmux }}

  # Single stable check name for branch protection.
  required:
    if: always()
    needs: [lint, e2e]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: required
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    secrets:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
