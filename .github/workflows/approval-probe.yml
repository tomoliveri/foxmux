# Temporary experiment: can a workflow approve the CI run GitHub holds on a
# pull request that a workflow opened? Removed after it has run once.
name: Approval probe

on: workflow_dispatch

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/approval-probe"
          git switch -c "$branch"
          date > .approval-probe
          git add .approval-probe
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Approval probe (temporary)"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title "Approval probe (temporary, will be closed)" --body "Automated experiment."
          for _ in $(seq 30); do
            run=$(gh run list --branch "$branch" --workflow ci.yml --event pull_request --json databaseId,conclusion --jq '.[] | select(.conclusion == "action_required") | .databaseId' | head -n 1)
            [ -n "$run" ] && break
            sleep 10
          done
          echo "held run: ${run:-none}"
          gh run list --branch "$branch" --workflow ci.yml --json databaseId,event,status,conclusion
          if [ -n "$run" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/approve" && echo "APPROVE: OK" || echo "APPROVE: FAILED"
          fi
