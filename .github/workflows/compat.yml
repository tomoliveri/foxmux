# Weekly early warning: test against upcoming Firefox and tmux versions and
# open an issue when something breaks.
name: Compatibility

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        firefox: [latest, latest-beta, latest-nightly, latest-esr]
        tmux: [release, master]
    uses: ./.github/workflows/e2e.yml
    with:
      firefox: ${{ matrix.firefox }}
      tmux: ${{ matrix.tmux }}

  # Run the current setup several times over to catch flaky tests before they
  # block a pull request.
  flaky:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    uses: ./.github/workflows/e2e.yml
    with:
      os: ${{ matrix.os }}
      repeat: 5

  report:
    needs: [e2e, flaky, nerd-fonts]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Compatibility check failing"
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "Still failing: $RUN_URL"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "A compatibility check failed (newer Firefox or tmux, a flaky test, or the Nerd Fonts update): $RUN_URL"
          fi

  # Nerd Fonts isn't on npm, so Dependabot can't track it. When a new release
  # is out, this opens a pull request with the updated font, approves the CI
  # run GitHub holds on it, and lets it merge once CI passes. If the licences
  # that apply to the font changed, it asks for a review instead of merging.
  nerd-fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: nerd-fonts
      cancel-in-progress: false
    permissions:
      contents: write # push the update branch
      pull-requests: write # open and auto-merge the pull request
      actions: write # approve the CI run GitHub holds on the pull request
      issues: write # fall back to an issue if pull requests are blocked
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Update the font
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/retry.sh pip install -r requirements-dev.txt
          out=$(python3 scripts/update_nerd_fonts.py)
          version=$(echo "$out" | sed -n 1p)
          if [ -z "$version" ]; then
            echo "The bundled font is current."
            exit 0
          fi
          scripts/retry.sh npm ci --ignore-scripts
          npx prettier --write NOTICE.md
          review=false
          if echo "$out" | grep -q licences-changed; then review=true; fi
          {
            echo "version=$version"
            echo "review=$review"
          } >> "$GITHUB_OUTPUT"

      - name: Open a pull request and start CI on it
        if: steps.update.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.update.outputs.version }}
          REVIEW: ${{ steps.update.outputs.review }}
        run: scripts/nerd-fonts-pr.sh
