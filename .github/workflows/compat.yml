# Weekly early warning: test against upcoming Firefox and tmux versions and
# open an issue when something breaks.
name: Compatibility

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        firefox: [latest, latest-beta, latest-nightly, latest-esr]
        tmux: [release, master]
    uses: ./.github/workflows/e2e.yml
    with:
      firefox: ${{ matrix.firefox }}
      tmux: ${{ matrix.tmux }}

  # Run the current setup several times over to catch flaky tests before they
  # block a pull request.
  flaky:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    uses: ./.github/workflows/e2e.yml
    with:
      os: ${{ matrix.os }}
      repeat: 5

  report:
    needs: [e2e, flaky]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Compatibility check failing"
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "Still failing: $RUN_URL"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "A newer Firefox or tmux broke the end-to-end tests: $RUN_URL"
          fi

  nerd-fonts:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/ryanoasis/nerd-fonts/releases/latest --jq .tag_name)
          if ! grep -q "| ${latest#v} |" NOTICE.md; then
            title="Update bundled Nerd Fonts symbols font to $latest"
            if [ -z "$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')" ]; then
              gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "https://github.com/ryanoasis/nerd-fonts/releases/tag/$latest"
            fi
          fi
