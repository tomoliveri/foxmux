<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-l10n-id="optionsTitle"></title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <form id="form">
      <label>
        <span data-l10n-id="optStartDir"></span>
        <input type="text" name="startDir" spellcheck="false" placeholder="~" />
        <small data-l10n-id="optStartDirHelp"></small>
      </label>

      <fieldset>
        <legend data-l10n-id="optSessions"></legend>
        <label class="inline">
          <input type="radio" name="sessionMode" value="per-tab" />
          <span data-l10n-id="optPerTab"></span>
        </label>
        <label class="inline">
          <input type="radio" name="sessionMode" value="shared" />
          <span data-l10n-id="optShared"></span>
        </label>
        <label>
          <span data-l10n-id="optSessionName"></span>
          <input
            type="text"
            name="sessionName"
            spellcheck="false"
            placeholder="main"
          />
        </label>
      </fieldset>

      <fieldset>
        <legend data-l10n-id="optAppearance"></legend>
        <label>
          <span data-l10n-id="optFontSize"></span>
          <input type="number" name="fontSize" min="6" max="48" />
        </label>
        <label>
          <span data-l10n-id="optFontFamily"></span>
          <input type="text" name="fontFamily" spellcheck="false" />
          <small data-l10n-id="optFontHelp"></small>
        </label>
        <label class="inline">
          <input type="checkbox" name="optionIsMeta" />
          <span data-l10n-id="optOptionIsMeta"></span>
        </label>
      </fieldset>

      <p id="status" role="status"></p>

      <p>
        <a
          class="button"
          href="https://github.com/tomoliveri/foxmux/issues/new"
          target="_blank"
          rel="noopener"
          data-l10n-id="optReportIssue"
        ></a>
      </p>
    </form>
    <script src="localize.js"></script>
    <script src="settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
