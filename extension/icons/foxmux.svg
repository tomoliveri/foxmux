<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232838"/>
      <stop offset="1" stop-color="#0d1017"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff5a36"/>
    </linearGradient>
    <clipPath id="frame"><rect x="2" y="2" width="60" height="60" rx="13"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect x="2" y="2" width="60" height="60" fill="url(#bg)"/>
    <!-- tmux pane divider -->
    <path d="M32 2 V53" stroke="#ffffff" stroke-opacity=".07" stroke-width="1.5"/>
    <!-- tmux status bar -->
    <rect x="2" y="53" width="60" height="9" fill="#2fbf71"/>
    <rect x="7" y="56" width="9" height="3" rx="1" fill="#0d1017"/>
    <rect x="19" y="56" width="5" height="3" rx="1" fill="#0d1017" fill-opacity=".45"/>
    <rect x="48" y="56" width="9" height="3" rx="1" fill="#0d1017" fill-opacity=".45"/>
  </g>
  <!-- geometric fox head -->
  <path d="M12 8 L26 19 H38 L52 8 L50 31 L32 49 L14 31 Z" fill="url(#fur)"/>
  <path d="M15 13 L22 19 L16 23 Z M49 13 L42 19 L48 23 Z" fill="#7a2410" fill-opacity=".55"/>
  <path d="M14 31 L27 35 L32 49 Z M50 31 L37 35 L32 49 Z" fill="#fff4e6"/>
  <!-- prompt eyes: > _ -->
  <path d="M21 24.5 L26 28 L21 31.5" fill="none" stroke="#0d1017" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M37 31 H44" stroke="#0d1017" stroke-width="3" stroke-linecap="round"/>
  <path d="M29.5 43.5 H34.5 L32 46.5 Z" fill="#0d1017"/>
</svg>
